<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QR Code Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <style>
    .gradient-bg {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1),
        0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }
    .text-dark {
      color: #2d3748;
    }
  </style>
</head>
<body class="min-h-screen gradient-bg flex flex-col items-center p-4">
  <!-- Logo -->
  <div class="mb-8 text-center">
    <div id="logo-container" class="h-24 flex items-center justify-center mb-4">
      <img
        src="/logo.jpg"
        alt="Logo"
        class="h-full w-auto mx-auto rounded-lg"
        onerror="this.onerror=null; this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNTAiIGhlaWdodD0iMjUwIiB2aWV3Qm94PSIwIDAgMjAwIDIwMCI+CiAgPHJlY3Qgd2lkdGg9IjIwMCIgaGVpZ2h0PSIyMDAiIGZpbGw9IiM2QjczRkYiLz4KICA8dGV4dCB4PSIxMDAiIHk9IjEwMCIgZm9udC1mYW1pbHk9IkFyaWFsIiBmb250LXNpemU9IjI0IiBmaWxsPSJ3aGl0ZSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSI+UVIgQ29kZTwvdGV4dD4KPC9zdmc+'"
      />
    </div>
    <h1 class="text-3xl font-bold text-gray-800">QR Code Generator</h1>
  </div>

  <div class="w-full max-w-md">
    <div class="card rounded-2xl p-8 shadow-2xl">
      <form id="qrForm" class="space-y-6">
        <div>
          <label for="text" class="block text-sm font-medium text-gray-800 mb-2"
            >Enter text or URL</label
          >
          <input
            type="text"
            id="text"
            name="text"
            required
            class="w-full px-4 py-3 rounded-lg bg-white text-dark placeholder-gray-400 border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition duration-200"
            placeholder="https://example.com"
          />
        </div>
        <div>
          <label for="filename" class="block text-sm font-medium text-gray-800 mb-2"
            >Filename (optional)</label
          >
          <input
            type="text"
            id="filename"
            name="filename"
            class="w-full px-4 py-3 rounded-lg bg-white text-dark placeholder-gray-400 border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition duration-200"
            placeholder="my_qr_code"
          />
        </div>
        <button
          type="submit"
          class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 flex items-center justify-center transform hover:-translate-y-0.5"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5 mr-2"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 4v16m8-8H4"
            />
          </svg>
          Generate QR Code
        </button>
      </form>

      <!-- Result Section -->
      <div id="result" class="mt-8 hidden">
        <div class="bg-white bg-opacity-10 p-6 rounded-lg text-center">
          <div class="flex justify-center mb-4">
            <img
              id="qrImage"
              src=""
              alt="Generated QR Code"
              class="w-48 h-48 object-contain mx-auto"
            />
          </div>
          <div
            id="buttonContainer"
            class="flex flex-col space-y-3 hidden"
          >
            <a
              id="downloadLink"
              href="#"
              class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-lg transition duration-200 text-center font-medium transform hover:-translate-y-0.5"
            >
              ⬇️ Download QR Code
            </a>
            <a
              id="shareLink"
              href="#"
              class="bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded-lg transition duration-200 text-center font-medium transform hover:-translate-y-0.5"
            >
              📤 Share QR Code
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document
      .getElementById("qrForm")
      .addEventListener("submit", async (e) => {
        e.preventDefault();

        const formData = new FormData(e.target);
        const resultDiv = document.getElementById("result");
        const qrImage = document.getElementById("qrImage");
        const downloadLink = document.getElementById("downloadLink");
        const shareLink = document.getElementById("shareLink");
        const buttonContainer = document.getElementById("buttonContainer");

        try {
          const submitButton = e.target.querySelector(
            'button[type="submit"]'
          );
          const originalButtonText = submitButton.innerHTML;
          submitButton.disabled = true;
          submitButton.innerHTML = "Generating...";

          const response = await fetch("/generate", {
            method: "POST",
            body: formData,
          });

          submitButton.disabled = false;
          submitButton.innerHTML = originalButtonText;

          if (!response.ok) {
            const error = await response.json();
            throw new Error(error.detail || "Failed to generate QR code");
          }

          const data = await response.json();
          if (!data.status || data.status !== "success" || !data.qr_code_url) {
            throw new Error("Invalid response from server");
          }

          const timestamp = new Date().getTime();
          const finalUrl =
            data.qr_code_url +
            (data.qr_code_url.includes("?") ? "&" : "?") +
            "t=" +
            timestamp;

          qrImage.src = finalUrl;
          downloadLink.href = finalUrl;
          downloadLink.download =
            data.qr_code_url.split("/").pop() || "qrcode.png";

          // Show results and buttons
          resultDiv.style.display = "block";
          resultDiv.classList.remove("hidden");
          buttonContainer.classList.remove("hidden");

          resultDiv.scrollIntoView({ behavior: "smooth" });
        } catch (error) {
          console.error("Error:", error);
          alert("Error: " + error.message);
        }
      });

    document
      .getElementById("shareLink")
      .addEventListener("click", async (e) => {
        e.preventDefault();
        const qrImage = document.getElementById("qrImage");

        try {
          if (navigator.share) {
            await navigator.share({
              title: "QR Code",
              text: "Check out this QR code I generated!",
              url: qrImage.src,
            });
          } else if (navigator.canShare) {
            const response = await fetch(qrImage.src);
            const blob = await response.blob();
            const file = new File([blob], "qrcode.png", { type: "image/png" });

            if (navigator.canShare({ files: [file] })) {
              await navigator.share({
                files: [file],
                title: "QR Code",
                text: "Check out this QR code I generated!",
              });
            } else {
              alert("Sharing not supported on this device");
            }
          } else {
            window.open(qrImage.src, "_blank");
          }
        } catch (err) {
          console.error("Error while sharing:", err);
          window.open(qrImage.src, "_blank");
        }
      });
  </script>
</body>
</html>
